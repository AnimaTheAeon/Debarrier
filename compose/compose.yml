# DeBarrier's two engines. Both listen only on the NAS itself
# (127.0.0.1); DeBarrier is what Materia talks to, on port 8191.
services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: debarrier-flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
    ports:
      - "127.0.0.1:8192:8191"
    tmpfs:
      - /tmp:size=256M,mode=1777

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: debarrier-byparr
    restart: unless-stopped
    shm_size: "1gb"
    ports:
      - "127.0.0.1:8193:8191"
    tmpfs:
      - /tmp:exec,mode=1777,size=1G
