# DeBarrier's two engines. Both listen only on the NAS itself
# (127.0.0.1); DeBarrier is what Materia talks to, on port 8191.
services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: debarrier-flaresolverr
    restart: unless-stopped
    # Container Manager runs this as a different user than the one that owns
    # /app, and FlareSolverr edits /app/chromedriver when it starts. So start
    # from a copy in /tmp that whoever runs it can write to.
    command:
      - sh
      - -c
      - >-
        rm -rf /tmp/app && cp -r /app /tmp/app &&
        sed -i 's#"/app/chromedriver"#"/tmp/app/chromedriver"#g' /tmp/app/utils.py &&
        (cp /package.json /tmp/app/package.json 2>/dev/null || true) &&
        cd /tmp/app && exec /usr/local/bin/python -u /tmp/app/flaresolverr.py
    environment:
      - LOG_LEVEL=info
      # Container Manager may start this without a home folder, which
      # leaves it as "/" (read-only), and Chrome's driver can't start.
      - HOME=/tmp
    ports:
      - "127.0.0.1:8192:8191"
    tmpfs:
      - /tmp:exec,size=1G,mode=1777

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: debarrier-byparr
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      - HOME=/tmp
    ports:
      - "127.0.0.1:8193:8191"
    tmpfs:
      - /tmp:exec,mode=1777,size=1G
